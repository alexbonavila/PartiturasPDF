name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      compatibility:
        description: Also execute API 27 and API 36 compatibility tests
        type: boolean
        default: false
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-android
      - run: bash ./gradlew :app:assembleDebug --stacktrace
      - name: Retain build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-diagnostics
          path: |
            build/reports/problems/
            app/build/outputs/logs/
          retention-days: 14

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-android
      - run: bash ./gradlew :app:lintDebug --stacktrace
      - name: Retain lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lint-reports
          path: app/build/reports/lint-results-debug.*
          retention-days: 14

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-android
      - run: bash ./gradlew :app:testDebugUnitTest --stacktrace
      - run: python3 scripts/verify_test_results.py app/build/test-results/testDebugUnitTest --required-test com.abdev.partituraspdf.ExampleUnitTest.addition_isCorrect
      - name: Retain unit test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          retention-days: 14

  instrumented-api26:
    name: instrumented-api26
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-android
      - name: Enable KVM for the hosted emulator
        run: |
          test -e /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute tests on Android API 26
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 26
          target: google_apis
          arch: x86_64
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" = "26"
            bash ./gradlew :app:connectedDebugAndroidTest --stacktrace
            python3 scripts/verify_test_results.py app/build/outputs/androidTest-results/connected --required-test com.abdev.partituraspdf.ExampleInstrumentedTest.useAppContext
      - name: Retain instrumentation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: instrumentation-api26-reports
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          retention-days: 14

  localization:
    name: localization
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts/tests -v
      - run: python scripts/validate_localization.py

  pdf-fixtures:
    name: pdf-fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: test-fixtures/requirements-fixtures.txt
      - run: python -m pip install -r test-fixtures/requirements-fixtures.txt
      - run: python test-fixtures/scripts/verify_fixtures.py

  compatibility:
    name: compatibility-api${{ matrix.api }}
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.compatibility)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [27, 36]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-android
      - name: Enable KVM for the hosted emulator
        run: |
          test -e /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute compatibility tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          EXPECTED_API: ${{ matrix.api }}
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-linux-hw-accel: false
          script: |
            test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" = "$EXPECTED_API"
            bash ./gradlew :app:connectedDebugAndroidTest --stacktrace
            python3 scripts/verify_test_results.py app/build/outputs/androidTest-results/connected --required-test com.abdev.partituraspdf.ExampleInstrumentedTest.useAppContext
      - name: Retain compatibility evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: instrumentation-api${{ matrix.api }}-reports
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          retention-days: 14

  quality-gate:
    name: quality-gate
    if: always()
    needs: [build, lint, unit-tests, instrumented-api26, localization, pdf-fixtures, compatibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Require actual success from every mandatory check
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          COMPATIBILITY_REQUIRED: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.compatibility) }}
        run: python3 scripts/quality_gate.py
