name: Set up existing Android toolchain
description: JDK 25, original Gradle wrapper and SDK 37 without project version changes
runs:
  using: composite
  steps:
    - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        distribution: temurin
        java-version: '25'
    - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      with:
        cache-read-only: ${{ github.event_name == 'pull_request' }}
        dependency-graph: disabled
        build-scan-publish: false
        add-job-summary-as-pr-comment: never
    - name: Install Android SDK packages
      shell: bash
      run: |
        python3 - <<'PY'
        import os
        import subprocess
        from pathlib import Path
        sdk = Path(os.environ['ANDROID_HOME'])
        manager = sdk / 'cmdline-tools/latest/bin/sdkmanager'
        subprocess.run([str(manager), '--licenses'], input='y\n' * 100, text=True, check=True)
        subprocess.run([str(manager), 'cmdline-tools;19.0'], check=True)
        manager = sdk / 'cmdline-tools/19.0/bin/sdkmanager'
        subprocess.run([str(manager), 'platform-tools', 'platforms;android-37.0',
                        'build-tools;37.0.0'], check=True)
        with open(os.environ['GITHUB_PATH'], 'a') as output:
            output.write(str(manager.parent) + '\n')
        PY
    - name: Record toolchain
      shell: bash
      run: |
        java -version
        bash ./gradlew --version
